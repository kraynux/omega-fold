[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omega-fold"
version = "0.1.0"
description = "Analyseur de structure de site/repertoire (local et distant), omega-fold"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "kraynux", email = "kraynux@proton.me" }]
requires-python = ">=3.10"
dependencies = [
    "omega-lib>=0.1.0",
    "textual>=0.60",
    "httpx>=0.27",
    "jinja2>=3.1",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-httpserver>=1.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
]

[project.scripts]
omega-fold = "omega_fold.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omega_fold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_classes = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

# Controle d'imports entre couches (voir OMEGA-FOLD_ARBORESCENCE.md §1 et
# ~/DEV/SUITE/DECISIONS_ARCHITECTURE.md D-000/D-007) : contrats copies
# verbatim depuis omega-deep/pyproject.toml, seuls les chemins de
# confinement par technologie sont adaptes a l'arborescence de FOLD.
# Ajoutes au fur et a mesure des phases (une source_modules/
# forbidden_modules qui reference un sous-module inexistant fait echouer
# lint-imports — meme discipline que CHECK/DEEP) : seuls les 2 premiers
# contrats sont actifs en Phase 1.
[tool.importlinter]
root_package = "omega_fold"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
# Ordre du plus exterieur (haut, autorise a importer tout ce qui suit) au
# plus interieur (bas, n'importe rien de la liste) :
#   app                                     -- racine de composition
#   infrastructure | interfaces | plugins   -- adaptateurs, independants entre eux
#   application                             -- cas d'usage
#   ports                                   -- contrats
#   domain                                  -- metier pur
#   core                                    -- vocabulaire transverse
name = "Dependency Rule : les couches externes dependent des internes, jamais l'inverse"
type = "layers"
layers = [
    "omega_fold.app",
    "omega_fold.infrastructure | omega_fold.interfaces | omega_fold.plugins",
    "omega_fold.application",
    "omega_fold.ports",
    "omega_fold.domain",
    "omega_fold.core",
]

[[tool.importlinter.contracts]]
name = "interfaces ne dependent jamais directement de infrastructure"
type = "independence"
modules = [
    "omega_fold.interfaces",
    "omega_fold.infrastructure",
]

[[tool.importlinter.contracts]]
name = "httpx/aiohttp/bs4/lxml seulement dans infrastructure.network"
type = "forbidden"
source_modules = [
    "omega_fold.core",
    "omega_fold.domain",
    "omega_fold.application",
    "omega_fold.ports",
    "omega_fold.interfaces",
    "omega_fold.plugins",
    "omega_fold.shared",
    "omega_fold.infrastructure.filesystem",
]
forbidden_modules = ["httpx", "aiohttp", "bs4", "lxml"]

[[tool.importlinter.contracts]]
name = "sqlite3 seulement dans infrastructure.storage.sqlite"
type = "forbidden"
source_modules = [
    "omega_fold.core",
    "omega_fold.domain",
    "omega_fold.application",
    "omega_fold.ports",
    "omega_fold.interfaces",
    "omega_fold.plugins",
    "omega_fold.shared",
    "omega_fold.infrastructure.filesystem",
    "omega_fold.infrastructure.network",
    "omega_fold.infrastructure.exporters",
]
forbidden_modules = ["sqlite3"]

[[tool.importlinter.contracts]]
name = "jinja2 seulement dans infrastructure.exporters.html_exporter"
type = "forbidden"
source_modules = [
    "omega_fold.core",
    "omega_fold.domain",
    "omega_fold.application",
    "omega_fold.ports",
    "omega_fold.interfaces",
    "omega_fold.plugins",
    "omega_fold.shared",
    "omega_fold.infrastructure.filesystem",
    "omega_fold.infrastructure.network",
    "omega_fold.infrastructure.storage",
    "omega_fold.infrastructure.exporters.json_exporter",
    "omega_fold.infrastructure.exporters.text_exporter",
    "omega_fold.infrastructure.exporters.family_chart",
    "omega_fold.infrastructure.exporters.html_theme_resolver",
]
forbidden_modules = ["jinja2"]

[[tool.importlinter.contracts]]
name = "textual seulement dans interfaces.tui"
type = "forbidden"
source_modules = [
    "omega_fold.core",
    "omega_fold.domain",
    "omega_fold.application",
    "omega_fold.ports",
    "omega_fold.plugins",
    "omega_fold.shared",
    "omega_fold.infrastructure",
    "omega_fold.interfaces.cli",
]
forbidden_modules = ["textual"]
